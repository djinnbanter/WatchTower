plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir layout.buildDirectory.dir('generated/resources')
}

repositories {
    mavenCentral()
}

base {
    archivesName = "watchtower-neoforge-${mod_version}+mc1.21"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        server {
            server()
            programArgument '--nogui'
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation project(':watchtower-core')
    implementation project(':watchtower-neoforge-common')

    jarJar project(':watchtower-core')
    jarJar project(':watchtower-neoforge-common')

    jarJar('dev.samstevens.totp:totp:1.7.1') {
        version {
            strictly '[1.7,1.8)'
            prefer '1.7.1'
        }
    }
    jarJar('com.google.zxing:core:3.4.0') {
        version {
            strictly '[3.4,3.5)'
            prefer '3.4.0'
        }
    }
    jarJar('com.google.zxing:javase:3.4.0') {
        version {
            strictly '[3.4,3.5)'
            prefer '3.4.0'
        }
    }
    jarJar('commons-codec:commons-codec:1.13') {
        version {
            strictly '[1.13,1.14)'
            prefer '1.13'
        }
    }

    // Gson is already on the NeoForge module path (gml, YACL, etc.) — do not jarJar it
    // or boot fails: ResolutionException: reads more than one module named com.google.gson

    additionalRuntimeClasspath project(':watchtower-core')
    additionalRuntimeClasspath project(':watchtower-neoforge-common')

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    archiveFileName = "watchtower-neoforge-${mod_version}+mc1.21.jar"
    manifest {
        attributes('Implementation-Version': mod_version)
    }
    dependsOn tasks.named('syncDashboard')
}

def dashboardDir = rootProject.file('web/dashboard')
def dashboardDist = new File(dashboardDir, 'dist')
def dashboardWebOut = layout.buildDirectory.dir('generated/resources/assets/watchtower/web')

tasks.register('buildDashboardAssets', Exec) {
    workingDir dashboardDir
    // Windows-friendly npm invocation
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'cmd', '/c', 'npm', 'run', 'build'
    } else {
        commandLine 'npm', 'run', 'build'
    }
    inputs.dir(new File(dashboardDir, 'src'))
    inputs.dir(new File(dashboardDir, 'assets'))
    inputs.dir(rootProject.file('docs/wiki'))
    inputs.file(new File(dashboardDir, 'package.json'))
    inputs.file(new File(dashboardDir, 'vite.config.ts'))
    inputs.file(new File(dashboardDir, 'index.html'))
    outputs.dir(dashboardDist)
}

tasks.register('syncDashboard', Copy) {
    dependsOn tasks.named('buildDashboardAssets')
    // Wipe previous sync output so deleted legacy assets cannot linger in the JAR
    doFirst {
        def outDir = dashboardWebOut.get().asFile
        if (outDir.exists()) {
            outDir.deleteDir()
        }
        if (!dashboardDist.isDirectory()) {
            throw new GradleException("dashboard dist missing after build: ${dashboardDist}")
        }
    }
    from(dashboardDist)
    into dashboardWebOut
    outputs.dir(dashboardWebOut)
}

tasks.named('processResources') {
    dependsOn tasks.named('syncDashboard')
}

tasks.register('verifyModJar') {
    def jarArchive = tasks.named('jar', Jar).flatMap { it.archiveFile }
    dependsOn tasks.named('jar')
    inputs.file(jarArchive)
    doLast {
        def jarFile = jarArchive.get().asFile
        if (!jarFile.isFile()) {
            throw new GradleException("Mod JAR not found: ${jarFile}")
        }
        if (jarFile.length() < 150_000) {
            throw new GradleException(
                    "Mod JAR too small (${jarFile.length()} bytes) — watchtower-core likely not embedded: ${jarFile.name}"
            )
        }

        def nestedJarContains = { java.util.zip.ZipFile outerZip, java.util.zip.ZipEntry nestedEntry, String classPath ->
            outerZip.getInputStream(nestedEntry).withCloseable { input ->
                def nestedZip = new java.util.zip.ZipInputStream(new java.io.ByteArrayInputStream(input.readAllBytes()))
                def found = false
                def entry
                while ((entry = nestedZip.nextEntry) != null) {
                    if (entry.name == classPath) {
                        found = true
                        break
                    }
                }
                nestedZip.close()
                found
            }
        }

        def zip = new java.util.zip.ZipFile(jarFile)
        try {
            if (zip.getEntry('META-INF/jarjar/metadata.json') == null) {
                throw new GradleException("Missing META-INF/jarjar/metadata.json in ${jarFile.name}")
            }

            def embeddedEntries = zip.entries().findAll { it.name.startsWith('META-INF/jarjar/') && it.name.endsWith('.jar') }
            def embedded = embeddedEntries.collect { it.name }

            def coreEntry = embeddedEntries.find { e -> e.name.contains('watchtower-core') }
            if (coreEntry == null) {
                throw new GradleException("No nested watchtower-core JAR in META-INF/jarjar/ of ${jarFile.name}")
            }
            if (!nestedJarContains(zip, coreEntry, 'dev/mcstatus/watchtower/core/report/ReportEngine.class')) {
                throw new GradleException("Nested watchtower-core JAR missing ReportEngine.class")
            }
            if (!nestedJarContains(zip, coreEntry,
                    'dev/mcstatus/watchtower/core/internal/protobuf/GeneratedMessageLite.class')) {
                throw new GradleException(
                        'Nested watchtower-core JAR missing relocated protobuf runtime (JPMS isolation)')
            }
            if (nestedJarContains(zip, coreEntry, 'com/google/protobuf/GeneratedMessageLite.class')) {
                throw new GradleException(
                        'Nested watchtower-core must not ship unrelocated com.google.protobuf (JPMS conflict)')
            }
            if (nestedJarContains(zip, coreEntry, 'org/checkerframework/checker/nullness/qual/NonNull.class')) {
                throw new GradleException(
                        'Nested watchtower-core must not ship org.checkerframework (JPMS clash with Groovy/etc.)')
            }

            def commonEntry = embeddedEntries.find { e -> e.name.contains('watchtower-neoforge-common') }
            if (commonEntry == null) {
                throw new GradleException("No nested watchtower-neoforge-common JAR in META-INF/jarjar/ of ${jarFile.name}")
            }
            if (!nestedJarContains(zip, commonEntry, 'dev/mcstatus/watchtower/DashboardHttpServer.class')) {
                throw new GradleException("Nested watchtower-neoforge-common JAR missing DashboardHttpServer.class")
            }

            def totpEntry = embeddedEntries.find { e -> e.name.toLowerCase().contains('totp') }
            if (totpEntry == null) {
                throw new GradleException("No nested TOTP JAR in META-INF/jarjar/ of ${jarFile.name}")
            }
            if (!nestedJarContains(zip, totpEntry, 'dev/samstevens/totp/qr/QrGenerator.class')) {
                throw new GradleException("Nested TOTP JAR missing QrGenerator.class")
            }

            def zxingEntry = embeddedEntries.find { e ->
                nestedJarContains(zip, e, 'com/google/zxing/Writer.class')
            }
            if (zxingEntry == null) {
                throw new GradleException("No nested ZXing JAR with Writer.class in META-INF/jarjar/ of ${jarFile.name}")
            }

            def gsonEmbedded = embedded.find { it.toLowerCase().contains('gson') }
            if (gsonEmbedded != null) {
                throw new GradleException(
                        "Gson must not be embedded (module conflict on boot): ${gsonEmbedded}"
                )
            }

            // React (Vite) dashboard assets
            def requiredWebAssets = [
                    'assets/watchtower/web/index.html',
                    'assets/watchtower/web/assets/watchtower-icon-simple.png',
            ]
            requiredWebAssets.each { assetPath ->
                if (zip.getEntry(assetPath) == null) {
                    throw new GradleException("Missing embedded dashboard asset ${assetPath} in ${jarFile.name}")
                }
            }
            def indexEntry = zip.getEntry('assets/watchtower/web/index.html')
            def indexText = new String(zip.getInputStream(indexEntry).readAllBytes(), java.nio.charset.StandardCharsets.UTF_8)
            if (!indexText.contains('root') || !(indexText.contains('assets/') || indexText.contains('./assets/'))) {
                throw new GradleException("Embedded index.html does not look like a Vite React build in ${jarFile.name}")
            }
            // Reject legacy Preact dashboard tree
            if (zip.getEntry('assets/watchtower/web/src/main.js') != null) {
                throw new GradleException("Legacy Preact src/main.js must not be embedded in ${jarFile.name}")
            }
            if (zip.getEntry('assets/watchtower/web/vendor/preact.module.js') != null) {
                throw new GradleException("Legacy Preact vendor must not be embedded in ${jarFile.name}")
            }
            if (zip.getEntry('assets/watchtower/web/tower/data.js') != null) {
                throw new GradleException("Legacy tower/ UI must not be embedded in ${jarFile.name}")
            }
            // Ensure at least one hashed JS chunk is present
            def hasJsChunk = zip.entries().any { it.name.startsWith('assets/watchtower/web/assets/') && it.name.endsWith('.js') }
            if (!hasJsChunk) {
                throw new GradleException("No Vite JS chunks under assets/watchtower/web/assets/ in ${jarFile.name}")
            }
            logger.lifecycle("verifyModJar OK: ${jarFile.name} (${jarFile.length()} bytes)")
            logger.lifecycle("  embedded: ${embedded.join(', ')}")
        } finally {
            zip.close()
        }
    }
}

tasks.named('build') {
    dependsOn tasks.named('verifyModJar')
}
