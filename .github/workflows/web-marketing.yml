name: Web marketing

on:
  push:
    branches: [main, master]
    paths:
      - 'web/marketing/**'
      - '.github/workflows/web-marketing.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'web/marketing/**'
      - '.github/workflows/web-marketing.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/marketing/package-lock.json

      - name: Install
        working-directory: web/marketing
        run: npm ci

      - name: Build
        working-directory: web/marketing
        run: npm run build
        env:
          NEXT_PUBLIC_DEMO_URL: ${{ vars.NEXT_PUBLIC_DEMO_URL }}
