plugins {
    id 'java-library'
    id 'com.google.protobuf' version '0.9.4'
    id 'com.gradleup.shadow' version '9.0.2'
}

group = 'dev.mcstatus.watchtower'
version = '2.0.6'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.5'
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {
                    option 'lite'
                }
            }
        }
    }
}

configurations {
    // Dedicated config so shadowJar only embeds protobuf (never gson/totp).
    protobufRuntime
    // SnakeYAML for crash rule packs — shaded to avoid JPMS clashes.
    yamlRuntime
    // TomlJ for config form editor — shaded to avoid ANTLR clashes.
    tomlRuntime
}

dependencies {
    api 'com.google.code.gson:gson:2.10.1'
    api 'dev.samstevens.totp:totp:1.7.1'
    // Compile against protobuf; runtime is shaded+relocated into this module's JAR
    // so JPMS mods that shadow com.google.protobuf (e.g. GriefLogger via MySQL) do not break Spark parse.
    compileOnly 'com.google.protobuf:protobuf-javalite:3.25.5'
    protobufRuntime 'com.google.protobuf:protobuf-javalite:3.25.5'
    testImplementation 'com.google.protobuf:protobuf-javalite:3.25.5'
    compileOnly 'org.yaml:snakeyaml:2.2'
    yamlRuntime 'org.yaml:snakeyaml:2.2'
    testImplementation 'org.yaml:snakeyaml:2.2'
    compileOnly 'org.tomlj:tomlj:1.1.1'
    tomlRuntime 'org.tomlj:tomlj:1.1.1'
    testImplementation 'org.tomlj:tomlj:1.1.1'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('jar', Jar) {
    // Consumers (NeoForge jarJar, CLI) use the shadowed artifact instead.
    enabled = false
    manifest {
        attributes(
                'FMLModType': 'LIBRARY',
                'Automatic-Module-Name': 'dev.mcstatus.watchtower.core'
        )
    }
}

tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    archiveClassifier.set('')
    configurations = [
            project.configurations.protobufRuntime,
            project.configurations.yamlRuntime,
            project.configurations.tomlRuntime
    ]
    relocate 'com.google.protobuf', 'dev.mcstatus.watchtower.core.internal.protobuf'
    relocate 'org.yaml.snakeyaml', 'dev.mcstatus.watchtower.core.internal.yaml'
    relocate 'org.tomlj', 'dev.mcstatus.watchtower.core.internal.tomlj'
    relocate 'org.antlr', 'dev.mcstatus.watchtower.core.internal.antlr'
    exclude 'module-info.class'
    mergeServiceFiles()
    manifest {
        attributes(
                'FMLModType': 'LIBRARY',
                'Automatic-Module-Name': 'dev.mcstatus.watchtower.core'
        )
    }
}

// Make shadowJar the default jar artifact for project dependencies / jarJar.
configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(tasks.named('shadowJar'))
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(tasks.named('shadowJar'))
    }
}

artifacts {
    archives tasks.named('shadowJar')
}

tasks.named('assemble') {
    dependsOn tasks.named('shadowJar')
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}

tasks.register('sparkAuditFixtures', JavaExec) {
    group = 'verification'
    description = 'Parse Spark example fixtures and write expected-*.json golden files'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.mcstatus.watchtower.core.collect.SparkFixtureAuditor'
    args = [rootProject.projectDir.absolutePath]
    systemProperty 'spark.audit.write', 'true'
}
